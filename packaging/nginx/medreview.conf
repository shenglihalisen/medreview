# medreview + Nginx（重点：/api/events 是 SSE 长连接，必须关缓冲）
#
# 用法：
#   sudo cp packaging/nginx/medreview.conf /etc/nginx/conf.d/
#   # 改下面三处：server_name、证书路径、静态目录/后端地址
#   sudo nginx -t && sudo systemctl reload nginx
#
# 两种部署都覆盖了：
#   ① 同源：Nginx 同时托管 web/ 静态文件 + 反代 /api（推荐，免 CORS）
#   ② 分离：前端在别处，这里只做 /api 反代（把 root 那段删掉即可）

upstream medreview_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name review.example.com;

    ssl_certificate     /etc/letsencrypt/live/review.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/review.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 可选：身份认证（内置认证已够用时可注释掉）
    # auth_basic           "medreview";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 0;

    # ---------- 前端静态文件（方案①用；方案②删掉这一段） ----------
    root  /var/www/medreview;      # web/ 目录的内容
    index home.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML 不缓存，静态资源短缓存（与后端内置静态服务策略一致）。
    # 放在 server 级而不是嵌套在 location / 里：嵌套的正则 location 虽然合法，
    # 但和 try_files / 未来新增的 location 叠在一起时优先级极难推理，
    # 出问题只表现为"某个页面拿到旧缓存"，很难查。平铺在最外层一眼能看懂。
    location ~* \.(?:html)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # ---------- SSE 长连接：/api/events ----------
    # 关键四行：HTTP/1.1、清空 Connection、关缓冲、拉长读超时。
    # 少了 proxy_buffering off，事件会被 Nginx 攒着不发，表现就是"页面数字不动"。
    location = /api/events {
        proxy_pass         http://medreview_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;          # SSE 不能被压缩缓冲
        proxy_read_timeout 3600s;        # 长连接：别用默认 60s
        proxy_send_timeout 3600s;

        # 后端已经会发 X-Accel-Buffering: no，这里再显式写一遍更保险
        add_header X-Accel-Buffering no;
    }

    # ---------- 其余 API ----------
    location /api/ {
        proxy_pass         http://medreview_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # 打包下载可能很大，也可能慢：关缓冲、拉长超时
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name review.example.com;
    return 301 https://$host$request_uri;
}
