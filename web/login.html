<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · medreview</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<style>
  /* 登录页：与首页/审阅页同一套设计语言（浅色、主色 #2563eb、圆角卡片） */
  body {
    min-height: 100vh; min-height: 100dvh; margin: 0;
    background:
      radial-gradient(900px 520px at 50% -12%, var(--primary-soft) 0%, rgba(232,240,254,0) 62%),
      var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    font: 14px/1.55 "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
  }
  .card {
    width: 100%; max-width: 392px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 18px 48px rgba(31,35,41,.10), 0 2px 6px rgba(31,35,41,.04);
    padding: 34px 32px 26px;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .mark {
    width: 42px; height: 42px; border-radius: 12px; flex: 0 0 auto;
    background: linear-gradient(140deg, var(--primary) 0%, #6d5cf5 100%);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 6px 16px rgba(37,99,235,.28);
  }
  .brand h1 { font-size: 18px; line-height: 1.2; margin: 0; font-weight: 750; letter-spacing: .2px; }
  .brand p { margin: 3px 0 0; font-size: 12.5px; color: var(--text-faint); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .wrap { position: relative; }
  .wrap input {
    width: 100%; height: 42px; padding: 0 12px;
    border: 1px solid var(--border-strong); border-radius: 9px;
    background: #fff; color: var(--text); font-size: 14px; font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .wrap input::placeholder { color: #b6bcc6; }
  .wrap input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,.14);
  }
  .wrap.pw input { padding-right: 44px; }
  .eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: 0; background: transparent; cursor: pointer;
    color: var(--text-faint); border-radius: 8px; display: grid; place-items: center;
  }
  .eye:hover { background: var(--bg); color: var(--text-dim); }

  .row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
  .hint { font-size: 12px; color: var(--text-faint); }

  .btn {
    width: 100%; height: 44px; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(100deg, var(--primary) 0%, #6d5cf5 100%);
    color: #fff; font-size: 14.5px; font-weight: 650; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: filter .15s, transform .05s;
    box-shadow: 0 8px 20px rgba(37,99,235,.22);
  }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { cursor: default; filter: grayscale(.25); opacity: .8; box-shadow: none; }
  .spin {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.45); border-top-color: #fff;
    animation: sp .7s linear infinite; display: none;
  }
  .btn.loading .spin { display: inline-block; }
  @keyframes sp { to { transform: rotate(360deg); } }

  .err {
    min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--reject);
    display: flex; align-items: center; gap: 6px;
  }
  .shake { animation: shake .35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-3px); }
  }

  .foot {
    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-faint); text-align: center; line-height: 1.7;
  }
  .foot b { color: var(--text-dim); font-weight: 600; }
  @media (max-width: 420px) {
    .card { padding: 26px 20px 20px; border-radius: 16px; }
  }
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="on" novalidate>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="15" rx="2.5"/>
          <circle cx="8.5" cy="9.5" r="1.4"/>
          <path d="M21 15l-4.5-4.5L7 19"/>
        </svg>
      </div>
      <div>
        <h1>medreview</h1>
        <p>素材审阅系统 · Media review</p>
      </div>
    </div>

    <div class="field">
      <label for="u">用户名 Username</label>
      <div class="wrap">
        <input id="u" name="user" autocomplete="username" required autofocus
               placeholder="请输入用户名" spellcheck="false">
      </div>
    </div>

    <div class="field">
      <label for="p">密码 Password</label>
      <div class="wrap pw">
        <input id="p" name="password" type="password" autocomplete="current-password"
               required placeholder="请输入密码">
        <button class="eye" id="eye" type="button" aria-label="显示密码" title="显示密码">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/>
            <circle cx="12" cy="12" r="2.6"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="row">
      <span class="hint">登录状态保持 12 小时</span>
      <span class="hint" id="host"></span>
    </div>

    <button class="btn" id="go" type="submit">
      <span class="spin" aria-hidden="true"></span>
      <span id="goText">登录</span>
    </button>

    <div class="err" id="err" role="alert" aria-live="polite"></div>

    <div class="foot">
      受信任环境使用 · 会话仅保存在本机浏览器<br>
      连续输错 5 次将锁定 15 分钟
    </div>
  </form>

<script>
(function () {
  "use strict";
  var f = document.getElementById("f");
  var user = document.getElementById("u");
  var pass = document.getElementById("p");
  var eye = document.getElementById("eye");
  var go = document.getElementById("go");
  var goText = document.getElementById("goText");
  var err = document.getElementById("err");
  var next = new URLSearchParams(location.search).get("next") || "/home.html";
  var busy = false;

  document.getElementById("host").textContent = location.host;

  // 显示/隐藏密码
  eye.addEventListener("click", function () {
    var show = pass.type === "password";
    pass.type = show ? "text" : "password";
    eye.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
    eye.title = show ? "隐藏密码" : "显示密码";
    pass.focus();
  });

  function fail(msg) {
    err.textContent = msg;
    f.classList.remove("shake");
    void f.offsetWidth;          // 重启动画
    f.classList.add("shake");
    go.disabled = false;
    go.classList.remove("loading");
    goText.textContent = "登录";
    busy = false;
  }

  f.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    err.textContent = "";
    if (!user.value.trim() || !pass.value) {
      fail("请填写用户名和密码");
      return;
    }
    busy = true;
    go.disabled = true;
    go.classList.add("loading");
    goText.textContent = "登录中…";

    fetch("api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: user.value.trim(), password: pass.value })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        return { ok: r.ok, status: r.status, j: j };
      });
    }).then(function (res) {
      if (res.ok) {
        goText.textContent = "登录成功";
        location.replace(next);
        return;
      }
      if (res.status === 429) return fail("尝试过于频繁，请 15 分钟后再试");
      fail(res.j.error || "用户名或密码错误");
    }).catch(function () {
      fail("网络错误，请确认服务是否在运行");
    });
  });
})();
</script>
</body>
</html>
