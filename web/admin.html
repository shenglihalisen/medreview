<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>仪表盘 · medreview</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1419">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0b1015; --panel: #121a22; --panel2: #16202a; --line: #243140;
    --text: #e6edf3; --dim: #93a1b1; --dim2: #6b7a8c;
    --blue: #4a9eff; --green: #3fb950; --red: #f85149; --amber: #d29922; --purple: #a371f7;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #16222e 0%, var(--bg) 60%) fixed;
    color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  a { color: var(--blue); text-decoration: none; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ---------- 顶栏 ---------- */
  .top {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: rgba(11,16,21,.86); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .brand { font-weight: 650; letter-spacing: .2px; }
  .brand span { color: var(--dim); font-weight: 400; margin-left: 6px; font-size: 13px; }
  .root { color: var(--dim); font-size: 12.5px; max-width: 46vw; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Consolas, monospace; }
  .spacer { flex: 1; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
  .dot.ok { background: var(--green); box-shadow: 0 0 8px rgba(63,185,80,.7); }
  .dot.err { background: var(--red); }
  .updated { font-size: 12px; color: var(--dim2); }
  .btn {
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    padding: 6px 12px; border-radius: 9px; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: #33465c; background: #1a2733; }

  /* ---------- 布局 ---------- */
  .wrap { max-width: 1280px; margin: 0 auto; padding: 18px 20px 40px; }
  .alert {
    margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; font-size: 13px;
    background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.4); color: #ffb3ae;
  }
  .alert b { color: #ffd7d3; }
  .hero { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, #101821 100%);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
    box-shadow: 0 6px 20px rgba(0,0,0,.22);
  }
  .card h2 {
    margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--dim);
    letter-spacing: .3px; display: flex; align-items: center; gap: 8px;
  }
  .card h2 .meta { color: var(--dim2); font-weight: 400; font-size: 12px; }
  .wide { grid-column: 1 / -1; }

  /* ---------- 审阅进度 ---------- */
  .hero-main { display: flex; align-items: center; gap: 22px; }
  .ring { position: relative; width: 108px; height: 108px; flex: 0 0 auto; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke: #1d2834; }
  .ring .bar { stroke: url(#ringGrad); stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
  .ring .pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 650;
  }
  .hero-stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px 22px; flex: 1; }
  .hstat b { display: block; font-size: 22px; font-weight: 650; line-height: 1.15; }
  .hstat span { color: var(--dim); font-size: 12px; }
  .hstat.keep b { color: var(--green); }
  .hstat.reject b { color: var(--red); }
  .hstat.pending b { color: var(--amber); }

  /* ---------- 小指标条 ---------- */
  .kv { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .kv span { color: var(--dim); font-size: 12.5px; }
  .kv b { font-size: 15px; font-weight: 600; }
  .barline { height: 6px; background: #1d2834; border-radius: 99px; overflow: hidden; margin: 8px 0 10px; }
  .barline i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 99px; transition: width .4s ease; }

  /* ---------- QC ---------- */
  .qc-row { display: grid; grid-template-columns: 88px 1fr 52px; gap: 10px; align-items: center; padding: 4px 0; }
  .qc-row .name { color: var(--dim); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .qc-row .track { height: 7px; background: #1a2430; border-radius: 99px; overflow: hidden; }
  .qc-row .track i { display: block; height: 100%; border-radius: 99px; background: var(--amber); transition: width .4s; }
  .qc-row b { text-align: right; font-size: 13px; font-weight: 600; }
  .qc-row.zero b { color: var(--dim2); font-weight: 400; }

  /* ---------- 目录 ---------- */
  .fold {
    display: grid; grid-template-columns: 1fr 110px; gap: 10px; padding: 9px 8px; border-radius: 10px;
    align-items: center; cursor: pointer; border: 1px solid transparent;
  }
  .fold:hover { background: #16202a; border-color: var(--line); }
  .fold .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fold .sub { color: var(--dim2); font-size: 11.5px; margin-top: 2px; display: flex; align-items: center; gap: 8px; }
  .fold .chip { padding: 0 6px; border-radius: 6px; background: #1c2836; color: #9fb0c3; font-size: 11px; }
  .fold .p { text-align: right; font-size: 12.5px; color: var(--dim); }
  .fold .p b { color: var(--text); font-size: 14px; margin-right: 3px; }

  /* ---------- 异常 / 人员 ---------- */
  .issue {
    display: flex; gap: 10px; align-items: baseline; padding: 7px 8px; border-radius: 8px;
    border-left: 3px solid var(--red); background: rgba(248,81,73,.05); margin-bottom: 6px;
  }
  .issue.warn { border-left-color: var(--amber); background: rgba(210,153,34,.06); }
  .issue .who { font-size: 12.5px; color: var(--text); max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .issue .why { color: var(--dim); font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .issue .kind { font-size: 11px; color: var(--dim2); border: 1px solid var(--line); padding: 0 6px; border-radius: 6px; }
  .people { display: flex; flex-wrap: wrap; gap: 8px; }
  .person {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px; border-radius: 99px;
    background: #16202a; border: 1px solid var(--line); font-size: 13px;
  }
  .person .av {
    width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(140deg,#2f81f7,#a371f7);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff;
  }
  .person small { color: var(--dim); font-size: 11.5px; }
  .empty { color: var(--dim2); font-size: 12.5px; padding: 14px 4px; text-align: center; }
  .skel { height: 10px; border-radius: 6px; background: linear-gradient(90deg,#16202a,#1d2a37,#16202a);
          background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .err-text { color: var(--red); font-size: 12.5px; }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; }
    .grid { grid-template-columns: 1fr; }
    .root { max-width: 60vw; }
    .wrap { padding: 12px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">medreview<span>仪表盘</span></div>
  <div class="root" id="rootPath" title="">目录：—</div>
  <div class="spacer"></div>
  <div class="conn"><i class="dot" id="dot"></i><span id="connText">连接中…</span></div>
  <div class="updated num" id="updated"></div>
  <a class="btn" href="review.html">打开审阅</a>
  <button class="btn" id="refresh" type="button">刷新</button>
</header>

<div class="wrap">
  <div class="alert" id="alert" hidden></div>

  <section class="hero">
    <article class="card hero-main">
      <div class="ring">
        <svg width="108" height="108" viewBox="0 0 108 108">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2f81f7"/><stop offset="100%" stop-color="#3fb950"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="54" cy="54" r="46" fill="none" stroke-width="10"/>
          <circle class="bar" id="ringBar" cx="54" cy="54" r="46" fill="none" stroke-width="10"
                  stroke-dasharray="289" stroke-dashoffset="289"/>
        </svg>
        <div class="pct num" id="pct">—</div>
      </div>
      <div class="hero-stats">
        <div class="hstat"><b id="kTotal">—</b><span>文件总数</span></div>
        <div class="hstat keep"><b id="kKeep">—</b><span>保留</span></div>
        <div class="hstat reject"><b id="kReject">—</b><span>不保留</span></div>
        <div class="hstat pending"><b id="kPending">—</b><span>待审</span></div>
      </div>
    </article>

    <article class="card">
      <h2>扫描 <span class="meta" id="scanMeta"></span></h2>
      <div class="barline"><i id="scanBar"></i></div>
      <div class="kv"><span>文件</span><b class="num" id="scanFiles">—</b></div>
      <div class="kv"><span>目录</span><b class="num" id="scanFolders">—</b></div>
      <div class="kv"><span>当前</span><b id="scanNow" style="font-size:12.5px;font-weight:400;color:var(--dim);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</b></div>
    </article>

    <article class="card">
      <h2>转码 <span class="meta" id="vtMeta"></span></h2>
      <div class="barline"><i id="vtBar" style="background:var(--purple)"></i></div>
      <div class="kv"><span>需转码</span><b class="num" id="vtNeed">—</b></div>
      <div class="kv"><span>完成 / 失败</span><b class="num"><span id="vtDone" style="color:var(--green)">—</span> / <span id="vtFail" style="color:var(--red)">—</span></b></div>
      <div class="kv"><span>跳过 / 缓存</span><b class="num" id="vtSkip">—</b></div>
    </article>
  </section>

  <section class="grid">
    <article class="card">
      <h2>质量概况 <span class="meta" id="qcMeta"></span></h2>
      <div id="qc"><div class="skel"></div></div>
    </article>

    <article class="card">
      <h2>目录进度 <span class="meta" id="foldMeta"></span></h2>
      <div id="folders"><div class="skel"></div></div>
    </article>

    <article class="card wide">
      <h2>异常中心 <span class="meta" id="issMeta"></span></h2>
      <div id="issues"><div class="skel"></div></div>
    </article>

    <article class="card">
      <h2>在岗人员 <span class="meta" id="wkMeta"></span></h2>
      <div id="workers"><div class="skel"></div></div>
    </article>

    <article class="card">
      <h2>素材构成 <span class="meta">照片 / 视频</span></h2>
      <div class="kv"><span>照片</span><b class="num" id="mPhoto">—</b></div>
      <div class="kv"><span>视频</span><b class="num" id="mVideo">—</b></div>
      <div class="kv"><span>预览已处理</span><b class="num" id="mDone">—</b></div>
      <div class="kv"><span>预览待处理</span><b class="num" id="mPend">—</b></div>
    </article>
  </section>
</div>

<script>
(function () {
  "use strict";

  // ---------- API 地址（前后端分离时可用）----------
  var API_BASE = (function () {
    function clean(v) { return String(v || "").trim().replace(/\/+$/, ""); }
    try {
      var q = new URLSearchParams(location.search).get("api");
      if (q) { localStorage.setItem("medreview.api", clean(q)); return clean(q); }
    } catch (e) {}
    try { var s = localStorage.getItem("medreview.api"); if (s) return clean(s); } catch (e) {}
    return "";
  })();
  function url(p) { return API_BASE + p; }
  function headers() {
    var h = {};
    if (API_BASE) {
      var tk = "";
      try { tk = localStorage.getItem("mr_token") || ""; } catch (e) {}
      if (tk) h["Authorization"] = "Bearer " + tk;
    }
    return h;
  }

  var SEC = {};                    // 各区块最新数据
  var timer = null;                // 轮询兜底

  var $ = function (id) { return document.getElementById(id); };
  function fmt(n) { return (n === undefined || n === null) ? "—" : Number(n).toLocaleString("zh-CN"); }
  function pct(a, b) { return b > 0 ? Math.min(100, Math.round(a * 100 / b)) : 0; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  // ---------- 渲染 ----------
  function renderTotals(t) {
    if (!t) return;
    var done = (t.keep || 0) + (t.reject || 0), total = t.files || 0;
    var p = pct(done, total);
    $("kTotal").textContent = fmt(total);
    $("kKeep").textContent = fmt(t.keep);
    $("kReject").textContent = fmt(t.reject);
    $("kPending").textContent = fmt(t.pending);
    $("pct").textContent = total ? p + "%" : "—";
    var C = 2 * Math.PI * 46;
    $("ringBar").setAttribute("stroke-dasharray", C.toFixed(1));
    $("ringBar").setAttribute("stroke-dashoffset", (C * (1 - p / 100)).toFixed(1));
  }

  function renderScan(s) {
    if (!s) return;
    $("scanFiles").textContent = fmt(s.files);
    $("scanFolders").textContent = fmt(s.folders);
    $("scanNow").textContent = s.running ? (s.current || "扫描中…") : "空闲";
    $("scanMeta").textContent = s.running ? "进行中" : "已完成";
    $("scanBar").style.width = s.running ? "100%" : "0%";
    $("scanBar").style.background = s.running ? "var(--amber)" : "var(--green)";
    if (s.error) {
      $("scanMeta").textContent = "出错";
      $("scanBar").style.background = "var(--red)";
    }
  }

  function renderVTrans(v) {
    if (!v) return;
    var done = v.done || 0, need = v.needConv || 0;
    $("vtNeed").textContent = fmt(need);
    $("vtDone").textContent = fmt(done);
    $("vtFail").textContent = fmt(v.failed);
    $("vtSkip").textContent = fmt(v.skipped) + " / " + fmt(v.cached);
    $("vtMeta").textContent = v.active ? "进行中" : (need ? "已完成" : "无视频");
    $("vtBar").style.width = pct(done + (v.failed || 0), need) + "%";
  }

  function renderMedia(m) {
    if (!m) return;
    $("mPhoto").textContent = fmt(m.photo);
    $("mVideo").textContent = fmt(m.video);
    $("mDone").textContent = fmt(m.processedDone);
    $("mPend").textContent = fmt(m.processedPending);
  }

  var QC = [
    ["corrupt", "损坏"], ["dup", "重复"], ["blank", "空镜"], ["dirt", "脏点"],
    ["blur", "模糊"], ["exposure", "曝光"], ["noise", "噪点"]
  ];
  function renderQC(q) {
    if (!q) return;
    var max = 1;
    QC.forEach(function (x) { max = Math.max(max, q[x[0]] || 0); });
    var html = QC.map(function (x) {
      var n = q[x[0]] || 0, w = Math.round((n / max) * 100);
      var color = n === 0 ? "var(--dim2)" : (x[0] === "corrupt" || x[0] === "dirt" ? "var(--red)" : "var(--amber)");
      return '<div class="qc-row' + (n ? "" : " zero") + '">' +
        '<div class="name">' + x[1] + "</div>" +
        '<div class="track"><i style="width:' + w + '%;background:' + color + '"></i></div>' +
        '<b class="num">' + fmt(n) + "</b></div>";
    }).join("");
    $("qc").innerHTML = html;
    $("qcMeta").textContent = q.total ? "已检 " + fmt(q.total) + " 个文件" : "";
  }

  function renderFolders(f) {
    if (!f) return;
    var top = f.top || [];
    if (!top.length) {
      $("folders").innerHTML = '<div class="empty">所有目录都审完了 🎉</div>';
    } else {
      $("folders").innerHTML = top.map(function (it) {
        var p = pct(it.done, it.total);
        return '<div class="fold" data-folder="' + it.folderId + '">' +
          '<div><div class="nm" title="' + esc(it.relPath) + '">' + esc(it.name) + "</div>" +
          '<div class="sub"><span>' + fmt(it.done) + " / " + fmt(it.total) + " 已审</span>" +
          (it.claimer ? '<span class="chip">' + esc(it.claimer) + "</span>" : "") +
          "</div></div>" +
          '<div class="p"><b class="num">' + fmt(it.pending) + "</b>待审" +
          '<div class="barline" style="margin:6px 0 0"><i style="width:' + p + '%;background:var(--green)"></i></div></div>' +
          "</div>";
      }).join("");
      Array.prototype.forEach.call(document.querySelectorAll(".fold"), function (el) {
        el.onclick = function () {
          location.href = "review.html?folder=" + el.getAttribute("data-folder") + "&filter=pending";
        };
      });
    }
    $("foldMeta").textContent = f.total ? ("已认领 " + fmt(f.claimed) + " / " + fmt(f.total) + (f.stale ? "，僵尸 " + f.stale : "")) : "";
  }

  function renderIssues(i) {
    if (!i) return;
    var items = i.items || [];
    if (!items.length) {
      $("issues").innerHTML = '<div class="empty">没有发现异常</div>';
      $("issMeta").textContent = "";
      return;
    }
    $("issues").innerHTML = items.slice(0, 60).map(function (x) {
      var kind = ({ transcode: "转码", missing: "丢失", scan: "扫描", qc: "质量" })[x.kind] || x.kind;
      return '<div class="issue' + (x.level === "warn" ? " warn" : "") + '">' +
        '<span class="kind">' + esc(kind) + "</span>" +
        '<span class="who" title="' + esc(x.name) + '">' + esc(x.name) + "</span>" +
        '<span class="why" title="' + esc(x.detail) + '">' + esc(x.detail) + "</span></div>";
    }).join("");
    $("issMeta").textContent = "共 " + fmt(i.count || items.length) + " 条";
  }

  function renderWorkers(w) {
    if (!w) return;
    var list = w.list || [];
    if (!list.length) {
      $("workers").innerHTML = '<div class="empty">最近 5 分钟没有人在线</div>';
    } else {
      $("workers").innerHTML = '<div class="people">' + list.map(function (p) {
        return '<span class="person" title="' + esc(p.claiming || "") + '">' +
          '<span class="av">' + esc((p.name || "?").slice(0, 1)) + "</span>" + esc(p.name) +
          (p.claiming ? "<small>· " + esc(p.claiming) + "</small>" : "") + "</span>";
      }).join("") + "</div>";
    }
    $("wkMeta").textContent = (w.reviewing ? w.reviewing + " 人在审" : "");
  }

  function renderHealth(hd) {
    if (!hd) return;
    var bad = [];
    if (!hd.db) bad.push("数据库不可用");
    if (!hd.root) bad.push("素材目录不可访问");
    if (!hd.cacheWritable) bad.push("缓存目录不可写");
    var al = $("alert");
    if (bad.length) {
      al.hidden = false;
      al.innerHTML = "<b>服务状态异常：</b>" + esc(bad.join("、")) + "。请检查运行参数与磁盘权限。";
    } else {
      al.hidden = true;
    }
  }

  function applySection(name, data) {
    SEC[name] = data;
    try {
      if (name === "totals") renderTotals(data);
      else if (name === "scan") renderScan(data);
      else if (name === "vtrans") renderVTrans(data);
      else if (name === "media") renderMedia(data);
      else if (name === "qc") renderQC(data);
      else if (name === "folders") renderFolders(data);
      else if (name === "issues") renderIssues(data);
      else if (name === "workers") renderWorkers(data);
      else if (name === "health") renderHealth(data);
    } catch (e) {
      console.error("渲染 " + name + " 失败", e);
    }
    var rp = $("rootPath");
    if (SEC.scan && SEC.scan.rootPath) {
      rp.textContent = "目录：" + SEC.scan.rootPath;
      rp.title = SEC.scan.rootPath;
    }
    touch();
  }

  function touch() {
    var d = new Date();
    $("updated").textContent = "更新于 " + d.toLocaleTimeString("zh-CN", { hour12: false });
  }

  function conn(ok, text) {
    $("dot").className = "dot " + (ok ? "ok" : "err");
    $("connText").textContent = text;
  }

  // ---------- 数据 ----------
  function loadFull() {
    return fetch(url("/api/dashboard"), { cache: "no-store", headers: headers() })
      .then(function (r) {
        if (r.status === 401) { location.href = "login.html?next=" + encodeURIComponent(location.pathname); throw new Error("未登录"); }
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (secs) {
        Object.keys(secs).forEach(function (k) { applySection(k, secs[k]); });
        conn(true, "实时");
      });
  }

  function startPolling() {
    if (timer) return;
    conn(false, "轮询中");
    timer = setInterval(function () {
      loadFull().catch(function (e) {
        conn(false, "连接失败");
        $("alert").hidden = false;
        $("alert").innerHTML = '<span class="err-text">' + esc(e.message) + "</span>";
      });
    }, 5000);
  }
  function stopPolling() { if (timer) { clearInterval(timer); timer = null; } }

  function startSSE() {
    if (typeof EventSource === "undefined") { startPolling(); return; }
    // 跨源时 EventSource 带不了 Authorization，直接走轮询
    if (API_BASE) { startPolling(); return; }
    var es = new EventSource(url("/api/events"));
    es.onopen = function () { stopPolling(); conn(true, "实时"); };
    es.onerror = function () { conn(false, "重连中…"); startPolling(); };
    es.onmessage = function (ev) {
      var d;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d.type === "init" && d.data && d.data.sections) {
        Object.keys(d.data.sections).forEach(function (k) { applySection(k, d.data.sections[k]); });
        conn(true, "实时");
        return;
      }
      if (d.type === "dash" && d.data && d.data.section) {
        applySection(d.data.section, d.data.data);
      }
    };
  }

  $("refresh").onclick = function () {
    $("refresh").disabled = true;
    loadFull().catch(function (e) {
      $("alert").hidden = false;
      $("alert").textContent = "刷新失败：" + e.message;
    }).then(function () { $("refresh").disabled = false; });
  };

  loadFull().then(startSSE).catch(function (e) {
    conn(false, "加载失败");
    $("alert").hidden = false;
    $("alert").innerHTML = '<span class="err-text">加载失败：' + esc(e.message) + '</span><br>检查服务是否在运行；前后端分离时在页面地址加 <code>?api=http://后端:8080</code>。';
    startPolling();
  });
})();
</script>
</body>
</html>
