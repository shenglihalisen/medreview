<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>medreview 控制台</title>
<style>
  :root{
    --bg:#0f131a;
    --panel:#161b24;
    --panel-2:#1b212c;
    --line:#252c38;
    --line-soft:#1f2530;
    --txt:#e6eaf2;
    --txt-dim:#9aa5b8;
    --txt-soft:#6b7688;
    --accent:#4f8cff;
    --accent-2:#7b5cff;
    --ok:#3ecf8e;
    --warn:#f0b429;
    --err:#f2616d;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--txt);
    font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
    font-size:13.5px;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    user-select:none;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input{font-family:inherit}

  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:center;gap:12px;
    padding:14px 18px;
    background:linear-gradient(180deg,#171d27,#131820);
    border-bottom:1px solid var(--line);
  }
  .logo{
    width:30px;height:30px;border-radius:9px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#fff;font-size:14px;letter-spacing:.5px;
  }
  .title{font-size:15px;font-weight:600;letter-spacing:.2px}
  .sub{font-size:11.5px;color:var(--txt-soft);margin-top:1px}
  .spacer{flex:1}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:999px;font-size:11.5px;
    background:#1d2531;border:1px solid var(--line-soft);color:var(--txt-dim);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.14)}
  .dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(240,180,41,.14)}

  /* ---------- 主体 ---------- */
  main{flex:1;overflow:auto;padding:14px 18px 4px;display:flex;flex-direction:column;gap:12px}
  .card{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .card h3{
    margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.4px;
    color:var(--txt-soft);text-transform:none;display:flex;align-items:center;gap:8px;
  }
  .card h3::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
  .row{display:flex;align-items:center;gap:8px}
  .row + .row{margin-top:8px}
  .lab{width:78px;flex:none;color:var(--txt-dim);font-size:12.5px}
  input[type=text]{
    flex:1;min-width:0;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    color:var(--txt);padding:8px 10px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
  input[type=text]::placeholder{color:#5c6675}

  .btn{
    padding:7px 12px;border-radius:8px;border:1px solid var(--line);
    background:#202836;color:var(--txt);transition:background .15s,border-color .15s,transform .05s;
    white-space:nowrap;
  }
  .btn:hover{background:#27303f;border-color:#33405a}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#3f74e8);border-color:transparent;color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent}
  .btn.danger{background:#3a2028;border-color:#4a2731;color:#ff9aa4}
  .btn.danger:hover{background:#4a2833}

  /* ---------- 地址列表 ---------- */
  .urls{display:flex;flex-direction:column;gap:6px}
  .url{
    display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;
    background:var(--panel-2);border:1px solid var(--line-soft);
  }
  .url .tag{
    flex:none;font-size:10.5px;padding:2px 7px;border-radius:5px;
    background:#243049;color:#9fc0ff;letter-spacing:.3px;
  }
  .url .tag.lan{background:#233041;color:#7fd0b0}
  .url .u{
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:#b9c6dd;font-size:12px;direction:ltr;text-align:left;
  }
  .url .u:hover{color:#fff;text-decoration:underline;cursor:pointer}
  .copy{background:none;border:none;color:var(--txt-soft);padding:2px 5px;border-radius:6px}
  .copy:hover{background:#2b3444;color:var(--txt)}

  /* ---------- 日志 ---------- */
  .logs-card{flex:1;min-height:200px;display:flex;flex-direction:column}
  .logbox{
    flex:1;overflow:auto;margin:0;padding:10px 12px;
    background:#0c1017;border:1px solid var(--line-soft);border-radius:10px;
    font-family:"Cascadia Mono","Consolas","Menlo",monospace;
    font-size:12px;line-height:1.65;color:#a9b6cc;white-space:pre-wrap;word-break:break-all;
    user-select:text;
  }
  .l{white-space:pre-wrap}
  .l.hi{color:#7fd0b0}
  .l.warn{color:#f0c674}
  .l.err{color:#ff9aa4}
  .l.dim{color:#6b7688}

  /* ---------- 底栏 ---------- */
  footer{
    display:flex;align-items:center;gap:8px;padding:10px 18px;
    border-top:1px solid var(--line);background:#131820;
  }
  .hint{font-size:11.5px;color:var(--txt-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(10px);
    background:#20283a;border:1px solid #33405a;color:var(--txt);
    padding:9px 14px;border-radius:10px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:70%;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.bad{border-color:#4a2731;background:#3a2028;color:#ffc2c7}
</style>
</head>
<body>

<header>
  <div class="logo">M</div>
  <div>
    <div class="title">medreview 控制台</div>
    <div class="sub">本地素材审阅 · 标记 / 打包 / 下载</div>
  </div>
  <div class="spacer"></div>
  <div class="pill"><span class="dot" id="dot"></span><span id="pillTxt">服务运行中</span></div>
</header>

<main>
  <!-- 素材根目录 -->
  <div class="card">
    <h3>素材根目录</h3>
    <div class="row">
      <span class="lab">当前目录</span>
      <input type="text" id="rootInput" placeholder="选择或直接填写文件夹路径">
      <button class="btn" id="btnPick">浏览…</button>
      <button class="btn primary" id="btnRoot">切换扫描</button>
    </div>
  </div>

  <!-- 监听地址 / 口令 -->
  <div class="card">
    <h3>服务地址</h3>
    <div class="row">
      <span class="lab">监听地址</span>
      <input type="text" id="addrInput" placeholder=":8080">
      <button class="btn primary" id="btnAddr">应用</button>
    </div>
    <div class="row">
      <span class="lab">下载口令</span>
      <input type="text" id="tokenInput" placeholder="下载页口令">
      <button class="btn" id="btnRand">换一个</button>
      <button class="btn primary" id="btnToken">应用</button>
    </div>
  </div>

  <!-- 地址速览 -->
  <div class="card">
    <h3>可直接打开的地址</h3>
    <div class="urls" id="urls"></div>
  </div>

  <!-- 日志 -->
  <div class="card logs-card">
    <h3>实时日志</h3>
    <div class="logbox" id="logbox"></div>
  </div>
</main>

<footer>
  <button class="btn" id="btnReview">打开审阅页</button>
  <button class="btn" id="btnDL">打开下载页</button>
  <button class="btn ghost" id="btnLog">打开日志文件</button>
  <div class="spacer"></div>
  <span class="hint" id="hint">改完点「应用」立即生效，不用重启程序</span>
  <button class="btn danger" id="btnQuit">停止服务</button>
</footer>

<div id="toast"></div>

<script>
  const api = window.go && window.go.main && window.go.main.UI;
  const $ = id => document.getElementById(id);
  let st = null, since = 0, booted = false;

  function toast(msg, bad){
    const t = $("toast");
    t.textContent = msg;
    t.className = bad ? "show bad" : "show";
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>{ t.className = ""; }, bad ? 4200 : 2400);
  }

  function copy(text){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("已复制"); }catch(e){ toast("复制失败", true); }
    ta.remove();
  }

  function clsOf(line){
    if(/启动成功|=====/.test(line)) return "l hi";
    if(/失败|错误|无法|Error|error/.test(line)) return "l err";
    if(/警告|注意|已被占用/.test(line)) return "l warn";
    if(/^---|^===/.test(line)) return "l dim";
    return "l";
  }

  async function pullLogs(){
    if(!api) return;
    try{
      const b = await api.Logs(since);
      const lines = b.Lines || [];
      since = Math.max(since, b.Seq || 0);
      if(!lines.length) return;
      const box = $("logbox");
      const frag = document.createDocumentFragment();
      for(const l of lines){
        const d = document.createElement("div");
        d.className = clsOf(l.Text);
        d.textContent = l.Text;
        frag.appendChild(d);
      }
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      box.appendChild(frag);
      while(box.childElementCount > 1200) box.removeChild(box.firstChild);
      if(atBottom || !booted) box.scrollTop = box.scrollHeight;
      booted = true;
    }catch(e){ /* 服务忙，下次再拉 */ }
  }

  async function refresh(){
    if(!api) { toast("未连接到服务", true); return; }
    try{
      st = await api.Status();
      if(document.activeElement !== $("rootInput"))  $("rootInput").value  = st.Root  || "";
      if(document.activeElement !== $("addrInput"))  $("addrInput").value  = st.Addr  || "";
      if(document.activeElement !== $("tokenInput")) $("tokenInput").value = st.Token || "";
      $("dot").className = st.FFmpeg ? "dot" : "dot off";
      $("pillTxt").textContent = st.FFmpeg ? "服务运行中" : "运行中 · 未找到 ffmpeg";

      const box = $("urls"); box.innerHTML = "";
      const add = (tag, url, lan)=>{
        if(!url) return;
        const row = document.createElement("div"); row.className = "url";
        const t = document.createElement("span"); t.className = "tag" + (lan?" lan":""); t.textContent = tag;
        const u = document.createElement("span"); u.className = "u"; u.textContent = url; u.title = url;
        u.onclick = ()=> api.Open(url);
        const c = document.createElement("button"); c.className = "copy"; c.textContent = "复制";
        c.onclick = ()=> copy(url);
        row.append(t,u,c); box.appendChild(row);
      };
      add("审阅页", st.ReviewURL);
      add("下载页", st.DownloadURL);
      (st.LANURLs||[]).forEach((u,i)=> add("局域网"+(i+1), u, true));
    }catch(e){ toast("读取状态失败: " + e, true); }
  }

  function call(promise, okMsg){
    promise.then(s=>{
      if(s) st = s; refresh();
      toast(okMsg);
    }).catch(e=> toast(String(e || e.message || "操作失败"), true));
  }

  $("btnPick").onclick = async ()=>{
    const p = await api.PickFolder();
    if(p){ $("rootInput").value = p; toast("已选择：" + p); }
  };
  $("btnRoot").onclick  = ()=> call(api.ScanRoot($("rootInput").value.trim()),  "已切换素材根目录");
  $("btnAddr").onclick  = ()=> call(api.SetAddr($("addrInput").value.trim()),   "监听地址已更新");
  $("btnToken").onclick = ()=> call(api.SetToken($("tokenInput").value.trim()), "下载口令已更新");
  $("btnRand").onclick  = ()=> call(api.RandomToken(),                          "已换成新口令");
  $("btnReview").onclick = ()=> st && api.Open(st.ReviewURL);
  $("btnDL").onclick     = ()=> st && api.Open(st.DownloadURL);
  $("btnLog").onclick    = ()=> st && api.OpenAppDir(st.LogPath);
  $("btnQuit").onclick   = ()=> { toast("正在停止服务…"); setTimeout(()=>api.Quit(), 200); };

  [["rootInput","btnRoot"],["addrInput","btnAddr"],["tokenInput","btnToken"]].forEach(([inp, btn])=>{
    $(inp).addEventListener("keydown", e=>{ if(e.key === "Enter") $(btn).click(); });
  });

  refresh();
  pullLogs();
  setInterval(pullLogs, 600);
  setInterval(refresh, 3000);
</script>
</body>
</html>
